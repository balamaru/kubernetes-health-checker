# Salin menjadi secret.yaml, isi nilainya, lalu: kubectl apply -f deploy/k8s/secret.yaml
# (atau buat langsung dengan kubectl, lihat README). JANGAN commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-health-secrets
  namespace: k8s-health
type: Opaque
stringData:
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/<id>/<token>"
  WEBHOOK_AUTH_TOKEN: "ganti-dengan-random-string-panjang"
  # Opsional — API key LLM (OpenAI/Anthropic/Gemini/Azure/OpenRouter/dll). Kosongkan untuk Ollama.
  LLM_API_KEY: ""
  # Opsional — konfigurasi LLM boleh ditaruh di sini (menimpa ConfigMap) atau di checker.yaml:
  # LLM_PROVIDER: "gemini"
  # LLM_MODEL: "<model yang masih aktif, lihat daftar model provider>"
